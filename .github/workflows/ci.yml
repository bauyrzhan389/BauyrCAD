name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      # Hosted Windows runners need software OpenGL for VTK screenshot tests.
      - name: Set up headless rendering
        uses: pyvista/setup-headless-display-action@9c1c7435d9635423c90d2c37489588c81673274a # v3
      - name: Test
        env:
          # API screenshots opt into off-screen rendering themselves; GUI tests need an interactor.
          PYVISTA_OFF_SCREEN: "false"
        run: pytest -v -o faulthandler_timeout=120 --durations=15
